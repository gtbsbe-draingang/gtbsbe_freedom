[project]
name = "cqa-backend"
version = "0.1.0"
description = "Conversation Quality Analytics backend (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
    "numpy==2.1.1",
    "scipy==1.15.2",
    "soundfile==0.14.0",
    "praat-parselmouth==0.4.7",
]

[project.scripts]
cqa-serve = "app.cli:serve"
cqa-snapshot = "app.cli:snapshot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One project holds app/, evaluator/, quality/ and audio/. The editable install puts
# backend/ itself on sys.path (dev-mode-dirs), so every top-level package that appears
# there is importable without touching this file.
[tool.hatch.build.targets.wheel]
packages = ["app"]
dev-mode-dirs = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "evaluator/tests"]
# importlib mode: no sys.path edits, so tests/app, tests/evaluator, tests/quality and tests/audio
# may hold test files with the same basename. Do not add tests/app/__init__.py (it would clash
# with the real `app` package).
addopts = ["--import-mode=importlib"]
